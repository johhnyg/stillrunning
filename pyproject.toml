[build-system]
requires = ["setuptools>=61.0,<68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stillrunning"
version = "2.0.0"
description = "AI-powered supply chain security. Blocks malicious packages at install and import time."
readme = "README.md"
authors = [
    {name = "johhnyg"}
]
keywords = ["security", "supply-chain", "import-hook", "mcp", "claude", "malware-detection", "threat-detection", "pickle-inspector"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://stillrunning.io"
Repository = "https://github.com/johhnyg/stillrunning"
Issues = "https://github.com/johhnyg/stillrunning/issues"
Documentation = "https://stillrunning.io/docs"

[project.scripts]
stillrunning = "stillrunning.cli:main_cli"
stillrunning-scan = "stillrunning.scan:main"
stillrunning-guard = "stillrunning.guard:main_loop"
stillrunning-intercept = "stillrunning.intercept:main"
pkl-inspector = "stillrunning.pkl_inspector:main"
stillrunning-docker = "stillrunning.docker_agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stillrunning*"]

