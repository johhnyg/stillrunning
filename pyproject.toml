[build-system]
requires = ["setuptools>=61.0,<68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stillrunning"
version = "1.6.0"
description = "Security + monitoring for indie builders. Guard daemon, static scanner, npm/pip intercept."
readme = "README.md"
authors = [
    {name = "johhnyg"}
]
keywords = ["monitoring", "devops", "automation", "process-monitor", "self-healing", "raspberry-pi", "docker", "indie-hacker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/johhnyg/stillrunning"
Repository = "https://github.com/johhnyg/stillrunning"
Issues = "https://github.com/johhnyg/stillrunning/issues"

[project.scripts]
stillrunning = "stillrunning:main_cli"

[tool.setuptools]
py-modules = ["stillrunning"]
