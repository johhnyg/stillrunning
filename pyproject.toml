[build-system]
requires = ["setuptools>=61.0,<68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stillrunning"
version = "1.3.0"
description = "Lightweight process monitor with Telegram alerts and Shield security. Auto-restarts crashed processes, monitors CPU/memory/disk, blocks SSH attacks, sends alerts."
readme = "README.md"
authors = [
    {name = "johhnyg"}
]
keywords = ["monitoring", "process", "watchdog", "telegram", "alerts", "devops", "server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/johhnyg/stillrunning"
Repository = "https://github.com/johhnyg/stillrunning"
Issues = "https://github.com/johhnyg/stillrunning/issues"

[project.scripts]
stillrunning = "stillrunning:main_cli"

[tool.setuptools]
py-modules = ["stillrunning"]
